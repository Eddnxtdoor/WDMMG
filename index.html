<style>
/* Layout: one narrow column like a banking app. Lock screen, then Home and Setup behind a bottom nav. */
:root {
  --bg: #F2F5F3;
  --surface: #FFFFFF;
  --ink: #15231C;
  --muted: #62736A;
  --line: #DCE3DE;
  --green: #1B4D3E;
  --green-ink: #FFFFFF;
  --warn: #D71921;
  --warn-bg: #FDECEC;
  --amber: #B86E00;
  --amber-bg: #FFF4E0;
  --dots: radial-gradient(var(--line) 1px, transparent 1.4px);
  --pot-1: #0F3B2E;
  --pot-2: #1B4D3E;
  --pot-3: #2D6B57;
  --pot-4: #4D8C75;
  --pot-5: #79AE98;
  --pot-6: #A9CBBB;
  --pot-7: #C9D2CD;
  --pot-debt: #B4483D;
  --font: "Manrope", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --mono: "DM Mono", ui-monospace, "SF Mono", Menlo, monospace;
  color-scheme: light;
}
* { box-sizing: border-box; }
html, body { min-height: 100%; }
body {
  background-color: var(--bg);
  background-image: var(--dots);
  background-size: 18px 18px;
  background-attachment: fixed;
  color: var(--ink);
  font-family: var(--font);
  font-size: 15px;
  line-height: 1.45;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 0;
}
.num { font-variant-numeric: tabular-nums; }
button { font: inherit; color: inherit; cursor: pointer; }
input { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--green); outline-offset: 2px; }

#app { max-width: 480px; margin: 0 auto; padding-bottom: 96px; }

/* Lock */
.lock { min-height: 80vh; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 24px; text-align: center; padding-top: 32px; }
.mark { font-family: "Doto", var(--mono); font-weight: 800; font-size: 24px; color: var(--green); display: inline-flex; align-items: center; gap: 6px; }
.mark::after { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--warn); display: block; }
.lock h1 { font-size: 20px; margin: 0; font-weight: 700; }
.lock p { margin: 0; color: var(--muted); max-width: 30ch; }
.dots { display: flex; gap: 14px; height: 16px; }
.dots i { width: 12px; height: 12px; border-radius: 50%; border: 2px solid var(--green); display: block; }
.dots i.on { background: var(--green); }
.keypad { display: grid; grid-template-columns: repeat(3, 76px); gap: 14px; }
.key { width: 76px; height: 76px; border-radius: 50%; border: 1px solid var(--line); background: var(--surface); font-family: "Doto", var(--mono); font-size: 30px; font-weight: 800; }
.key:active { background: var(--bg); }
.key.ghost { border-color: transparent; background: transparent; font-family: var(--mono); font-size: 13px; font-weight: 500; color: var(--muted); }
.err { color: var(--warn); min-height: 20px; font-weight: 600; }

/* Header */
.top { background-image: var(--dots); background-size: 18px 18px; background-attachment: fixed; display: flex; align-items: center; justify-content: space-between; padding: 18px 0 10px; position: sticky; top: env(safe-area-inset-top, 0px); background: var(--bg); z-index: 5; }
.monthnav { display: flex; align-items: center; gap: 4px; }
.monthnav button { width: 36px; height: 36px; border-radius: 50%; border: 1px solid var(--line); background: var(--surface); }
.monthnav span { font-family: var(--mono); font-size: 12.5px; min-width: 120px; text-align: center; font-weight: 700; }

/* Surfaces */
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 24px; padding: 20px; margin-top: 12px; }
.hero { background-color: var(--green); background-image: radial-gradient(rgba(255,255,255,.22) 1px, transparent 1.5px); background-size: 14px 14px; color: var(--green-ink); border: 0; }
.hero .label { color: #BFD6CB; }
.label { font-family: var(--mono); font-size: 12px; color: var(--muted); font-weight: 500; }
.big { font-family: "Doto", var(--mono); font-size: 38px; font-weight: 800; letter-spacing: 0; line-height: 1.1; margin: 6px 0 8px; }
.sub { font-size: 13px; color: #BFD6CB; }
h2 { font-size: 16px; margin: 0 0 12px; font-weight: 700; }

.split { display: flex; height: 18px; border-radius: 9px; overflow: hidden; margin-top: 16px; background: rgba(255,255,255,.18); }
.split span { display: block; min-width: 2px; }
.card .split { background: var(--bg); margin-top: 0; margin-bottom: 14px; }

.pot { display: grid; grid-template-columns: 12px 1fr auto; gap: 10px; align-items: center; padding: 10px 0; border-top: 1px solid var(--line); }
.pot:first-of-type { border-top: 0; }
.pot .sw { width: 12px; height: 12px; border-radius: 4px; }
.pot .name { font-weight: 600; min-width: 0; }
.pot .meta { color: var(--muted); font-size: 12px; font-weight: 500; }
.pot .amt { font-weight: 700; text-align: right; }
.pot.child { padding-left: 22px; }
.pot.child .name { font-weight: 500; }
.bar { height: 6px; border-radius: 3px; background: var(--bg); overflow: hidden; margin-top: 6px; }
.bar i { display: block; height: 100%; background: var(--pot-2); border-radius: 3px; }

.note { background: var(--warn-bg); color: var(--warn); border-radius: 12px; padding: 10px 12px; font-weight: 600; font-size: 13px; margin-top: 12px; }

/* Charts, Nothing-style: thick segmented ring, dot-matrix centre figure */
.ring, .tagchart { display: block; overflow: visible; }
.ring { width: 100%; max-width: 340px; margin: 4px auto 0; }
.tagchart { width: calc(100% + 28px); margin: 0 -14px; }
.emptyring { fill: none; stroke: var(--line); }
.slice { fill: none; }
.cb { font-family: "Doto", var(--mono); font-weight: 800; fill: var(--ink); }
.cl, .cs { font-family: var(--mono); font-size: 11.5px; fill: var(--muted); }
.ringcard { cursor: pointer; }
/* PIN feedback: the pressed key flashes and the new dot pops. The digit itself is never shown. */
.key.hit { animation: keyhit .26s ease-out; }
.key.ghost.hit { animation: ghosthit .22s ease-out; }
@keyframes keyhit { 0% { background: #E3EEE8; border-color: #C5D9CE; transform: scale(.965); } 100% { background: var(--surface); transform: none; } }
@keyframes ghosthit { 0% { color: var(--ink); } 100% { color: var(--muted); } }
.dots i { position: relative; }
.dots i.pop { animation: dotpop .22s ease-out; }
@keyframes dotpop { from { transform: scale(1.25); } }
.dots.shake { animation: shake .4s cubic-bezier(.36, .07, .19, .97); }
@keyframes shake { 25%, 75% { transform: translateX(-4px); } 50% { transform: translateX(4px); } }
@media (prefers-reduced-motion: reduce) { .key.hit, .dots i.pop, .dots.shake { animation: none; } }
/* Hold Home: a mini ring grows out of the Home button */
nav button[data-tab="home"] { touch-action: none; -webkit-touch-callout: none; user-select: none; -webkit-user-select: none; }
.hscrim { position: fixed; inset: 0; z-index: 30; background: rgba(242, 245, 243, .65); animation: fade .2s ease; }
.hpop { position: fixed; z-index: 31; background: var(--surface); border: 1px solid var(--line); border-radius: 26px; padding: 10px 10px 8px; box-shadow: 0 10px 26px rgba(21, 35, 28, .18); animation: hgrow .34s cubic-bezier(.2, .9, .3, 1.3); touch-action: none; user-select: none; -webkit-user-select: none; }
@keyframes hgrow { from { transform: scale(.08); opacity: 0; } }
.hpop svg { display: block; width: 160px; height: 160px; overflow: visible; }
.hpop .sl { cursor: pointer; transition: transform .18s cubic-bezier(.2, .9, .3, 1.3), opacity .15s ease; }
.hpop .sl.hot { transform: translate(var(--dx), var(--dy)); }
.hpop.dimmed .sl:not(.hot) { opacity: .45; }
.hpop .hc1 { font-family: var(--mono); font-size: 10px; fill: var(--muted); }
.hpop .hc2 { font-family: "Doto", var(--mono); font-weight: 800; font-size: 16px; fill: var(--ink); }
.hcap { text-align: center; font-weight: 800; font-size: 13px; margin-top: 4px; min-height: 18px; }
@media (prefers-reduced-motion: reduce) { .hpop, .hscrim { animation: none; } .hpop .sl { transition: none; } }
.cur { height: 44px; border: 1px solid var(--line); border-radius: 12px; padding: 0 10px; background: var(--surface); font: inherit; font-family: var(--mono); color: var(--ink); }
.ratelab { align-self: center; font-family: var(--mono); font-size: 13px; color: var(--muted); }
#addIncome .row { margin-top: 8px; }
#addIncome .row:first-child { margin-top: 0; }
.syncdot { flex: 0 0 auto; width: 8px; height: 8px; border-radius: 50%; background: var(--muted); display: inline-block; }
.syncdot.synced { background: var(--green); }
.syncdot.saving { background: var(--amber); }
.syncdot.error, .syncdot.full { background: var(--warn); }
/* Grade */
.gradecard { display: grid; grid-template-columns: 76px minmax(0, 1fr) auto; gap: 14px; align-items: center; cursor: pointer; }
.gtile { width: 76px; height: 76px; border-radius: 20px; background: var(--ink); color: #fff; display: grid; place-items: center; font-family: "Doto", var(--mono); font-weight: 800; font-size: 46px; line-height: 1; }
.gtile.big { width: 104px; height: 104px; border-radius: 26px; font-size: 64px; }
.gtile.g-A, .gtile.g-B { background: var(--green); }
.gtile.g-D, .gtile.g-E { background: var(--amber); }
.gtile.g-F { background: var(--warn); }
.gtile.empty { background: var(--bg); color: var(--muted); border: 1px dashed var(--line); font-size: 30px; }
.gmeta .label { margin-bottom: 2px; }
.gmeta p { margin: 0; font-size: 13px; color: var(--muted); }
.area { padding: 10px 0; border-top: 1px solid var(--line); }
.area:first-of-type { border-top: 0; }
.area-top { display: flex; justify-content: space-between; gap: 8px; font-weight: 600; font-size: 14px; }
.area-top span:last-child { font-family: var(--mono); font-size: 12.5px; color: var(--muted); font-weight: 400; }
.pill { display: inline-block; padding: 2px 9px; border-radius: 999px; font-family: var(--mono); font-size: 11px; margin-left: 6px; vertical-align: 1px; }
.pill.good { background: #E6F1EB; color: var(--green); }
.pill.weak { background: var(--amber-bg); color: var(--amber); }
.duo { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.mtile { border: 1px solid var(--line); border-radius: 18px; padding: 14px; display: grid; gap: 8px; }
.mtile .gtile { width: 48px; height: 48px; border-radius: 14px; font-size: 28px; }
.mtile .n { font-weight: 700; font-size: 14px; }
.mtile .m { font-family: var(--mono); font-size: 11.5px; color: var(--muted); }
.hist { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 2px; }
.hist div { flex: 0 0 auto; text-align: center; font-family: var(--mono); font-size: 11px; color: var(--muted); }
.hist .gtile { width: 40px; height: 40px; border-radius: 12px; font-size: 22px; margin-bottom: 4px; }
/* Line charts */
.lc-head { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; margin-top: 6px; }
.lc-val { font-family: "Doto", var(--mono); font-weight: 800; font-size: 30px; }
.delta { font-family: var(--mono); font-size: 12px; padding: 3px 9px; border-radius: 999px; }
.delta.up { background: #E6F1EB; color: var(--green); }

.lc { display: block; width: 100%; margin-top: 8px; touch-action: pan-y; overflow: visible; }
.lc .grid { stroke: var(--line); stroke-width: 1; }
.lc .axis { font-family: var(--mono); font-size: 10px; fill: var(--muted); }
.lc .line { fill: none; stroke: var(--green); stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
.lc .proj { fill: none; stroke: var(--green); stroke-width: 2; stroke-dasharray: 2 5; stroke-linecap: round; opacity: .7; }
.lc .goal { stroke: var(--warn); stroke-width: 1.2; stroke-dasharray: 4 4; }

.lc .end { fill: var(--green); stroke: var(--surface); stroke-width: 2; }
.lc .xh { stroke: var(--ink); stroke-width: 1; opacity: 0; }
.pl .zero { stroke: var(--muted); stroke-width: 1; stroke-dasharray: 3 4; }
.pl .seg { stroke-width: 2.2; stroke-linecap: round; }
.pl .seg.up { stroke: var(--green); }
.pl .seg.down { stroke: var(--warn); }
.pl .pt { stroke: var(--surface); stroke-width: 1.5; }
.pl .pt.up { fill: var(--green); }
.pl .pt.down { fill: var(--warn); }
.pl .pt.old { fill: var(--surface); stroke-width: 1.8; }
.pl .pt.old.up { stroke: var(--green); }
.pl .pt.old.down { stroke: var(--warn); }
.pl .put { fill: none; stroke: var(--muted); stroke-width: 1.6; stroke-dasharray: 4 4; }
.itxrow .itxopen { all: unset; display: block; min-width: 0; cursor: pointer; border-radius: 8px; }
.itxrow .itxopen:focus-visible { outline: 2px solid var(--green); outline-offset: 3px; }
.itxrow .itxopen:hover .n { text-decoration: underline; text-underline-offset: 3px; }
.itxrow.armed { grid-template-columns: minmax(0, 1fr) auto; }
.choices.ixtypes { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 6px; }
.ixtypes .choice span { padding: 9px 8px; font-size: 13px; }
#itxForm:not([data-t="dep"]):not([data-t="wd"]) .ix-flow, #itxForm:not([data-t="adj"]) .ix-adj, #itxForm:not([data-t="div"]) .ix-div, #itxForm[data-fx="false"] .ix-fx { display: none; }
.chk { display: flex; gap: 10px; align-items: center; font-size: 14px; margin-top: 12px; }
.ferr { color: var(--warn); font-size: 13px; font-weight: 600; margin: 10px 0 0; }
input[type="date"] { min-height: 44px; }
.lc .xd { fill: var(--surface); stroke: var(--ink); stroke-width: 2; opacity: 0; }
.lc.active .xh, .lc.active .xd { opacity: 1; }
.lc-lab { font-family: var(--mono); font-size: 12px; color: var(--muted); }
.goalbar { height: 14px; border-radius: 7px; background: rgba(255, 255, 255, .18); overflow: hidden; margin-top: 12px; }
.goalbar i { display: block; height: 100%; background: #fff; border-radius: 7px; }
.kv { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 10px; padding: 10px 0; border-top: 1px dashed var(--line); }
.kv:first-of-type { border-top: 0; }
.kv .n { font-weight: 600; font-size: 14px; }
.kv .m { font-family: var(--mono); font-size: 11.5px; color: var(--muted); }
.kv .a { font-family: var(--mono); font-size: 13px; font-weight: 500; text-align: right; }
/* Spending */
.alert { display: grid; grid-template-columns: 8px minmax(0, 1fr); gap: 10px; align-items: start; border-radius: 16px; padding: 12px 14px; margin-top: 10px; font-size: 13px; font-weight: 600; }
.alert::before { content: ""; width: 8px; height: 8px; border-radius: 50%; margin-top: 5px; background: currentColor; }
.alert.warn { background: var(--amber-bg); color: var(--amber); }

.sp { padding: 10px 0; border-top: 1px solid var(--line); }
.sp:first-of-type { border-top: 0; }

.sp-top i { width: 10px; height: 10px; border-radius: 50%; display: block; align-self: center; }
.sp-top .n { font-weight: 700; }
.sp-top .v { font-family: var(--mono); font-size: 12.5px; text-align: right; }
.sp-top .v b { font-weight: 500; color: var(--ink); }
.sp-top .v span { color: var(--muted); }
.meter { height: 8px; border-radius: 4px; background: var(--bg); overflow: hidden; margin-top: 8px; position: relative; }
.meter i { display: block; height: 100%; border-radius: 4px; background: var(--green); transition: width .4s ease; }
.meter::after { content: ""; position: absolute; left: 80%; top: 0; bottom: 0; width: 2px; background: var(--surface); }
.meter.warn i { background: var(--amber); }
.meter.over i { background: var(--warn); }
.st { font-family: var(--mono); font-size: 11.5px; margin-top: 5px; color: var(--muted); }
.st.warn { color: var(--amber); }
.st.over { color: var(--warn); }
.exp { display: grid; grid-template-columns: minmax(0, 1fr) auto auto; gap: 10px; align-items: center; padding: 9px 0; border-top: 1px dashed var(--line); }
.exp .n { font-weight: 600; font-size: 14px; overflow-wrap: anywhere; }
.exp .m { font-family: var(--mono); font-size: 11.5px; color: var(--muted); }
.exp .a { font-family: var(--mono); font-size: 13px; font-weight: 500; }
.exp .ib { width: 34px; height: 34px; }
.exp .ib.armed { height: 34px; }
.sublabel { font-family: var(--mono); font-size: 12px; color: var(--muted); margin: 14px 0 2px; }
.fab { position: fixed; z-index: 9; right: max(20px, calc(env(safe-area-inset-right, 0px) + 12px)); bottom: calc(76px + env(safe-area-inset-bottom, 0px)); width: 58px; height: 58px; border-radius: 50%; border: 0; background: var(--green); color: #fff; display: grid; place-items: center; box-shadow: 0 6px 18px rgba(21, 35, 28, .25); -webkit-tap-highlight-color: transparent; }
.fab:active { transform: scale(.94); }
.scrim { position: fixed; inset: 0; z-index: 20; background: rgba(21, 35, 28, .35); animation: fade .2s ease; }
.sheet { position: fixed; z-index: 21; left: 0; right: 0; bottom: 0; background: var(--surface); border-radius: 28px 28px 0 0; padding: 10px max(16px, env(safe-area-inset-left, 0px)) calc(20px + env(safe-area-inset-bottom, 0px)); animation: up .28s cubic-bezier(.2, .9, .3, 1); }
.sheet-in { max-width: 480px; margin: 0 auto; }
.grab { width: 40px; height: 4px; border-radius: 2px; background: var(--line); margin: 0 auto 14px; }
.sheet h3 { margin: 0; font-size: 17px; font-weight: 800; }
.amt-in { width: 100%; border: 0; border-bottom: 2px solid var(--line); padding: 8px 0; margin: 10px 0 14px; font-family: "Doto", var(--mono); font-weight: 800; font-size: 40px; background: transparent; }
.amt-in:focus { outline: none; border-bottom-color: var(--green); }
.amt-in::-webkit-inner-spin-button, .amt-in::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
.amt-in { -moz-appearance: textfield; appearance: textfield; }
.choices { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.choice { position: relative; }
.choices.four { grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px; }
.choices.four .choice span { padding: 8px 4px; font-size: 12px; border-radius: 14px; }
.choices.four .choice small { font-size: 10px; }
.sheet { max-height: 92dvh; overflow-y: auto; }
.exp.mv .a { color: var(--green); }
.exp.back .a { color: var(--green); }
.tapedit { cursor: pointer; -webkit-tap-highlight-color: transparent; border-radius: 8px; }
.tapedit:active { background: var(--bg); }
.tapedit:focus { outline: none; }
.tapedit:focus-visible { outline: 2px solid var(--green); outline-offset: 2px; }
.smrow { padding: 9px 0; border-top: 1px dashed var(--line); }
.smrow:first-of-type { border-top: 0; }
.smtop { display: flex; justify-content: space-between; align-items: baseline; font-weight: 600; font-size: 14px; }

.smtop .num { font-family: var(--mono); font-size: 13px; font-weight: 500; }

.ppbtns { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.spx { padding: 14px 0; border-top: 1px dashed var(--line); margin-top: 12px; }

.spx .m { font-family: var(--mono); font-size: 11.5px; color: var(--muted); margin-top: 2px; }

.spx-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; }

.choice input { position: absolute; opacity: 0; inset: 0; }
.choice span { display: block; border: 1px solid var(--line); border-radius: 16px; padding: 10px; text-align: center; font-weight: 700; font-size: 13px; }
.choice small { display: block; font-family: var(--mono); font-weight: 400; font-size: 11px; color: var(--muted); margin-top: 2px; }
.choice input:checked + span { border-color: var(--green); background: #EAF2EE; box-shadow: inset 0 0 0 1px var(--green); }
.choice input:focus-visible + span { outline: 2px solid var(--green); outline-offset: 2px; }
.sheet .row { margin-top: 12px; }
.toast { position: fixed; z-index: 30; left: 50%; bottom: calc(150px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--ink); color: #fff; padding: 10px 16px; border-radius: 999px; font-size: 13px; font-weight: 600; max-width: calc(100% - 32px); animation: up .25s ease; }
@keyframes up { from { transform: translateY(24px); opacity: 0; } to { transform: none; opacity: 1; } }
.toast { animation-name: toastIn; }
@keyframes toastIn { from { transform: translate(-50%, 16px); opacity: 0; } to { transform: translate(-50%, 0); opacity: 1; } }
@keyframes fade { from { opacity: 0; } to { opacity: 1; } }
.ret .card { animation: retIn .34s cubic-bezier(.2, .8, .2, 1) both; }
.ret .card:nth-of-type(2) { animation-delay: .04s; }
.ret .card:nth-of-type(3) { animation-delay: .08s; }
.ret .card:nth-of-type(4) { animation-delay: .12s; }
.ret .card:nth-of-type(5) { animation-delay: .16s; }
.ret .ring { animation: ringIn .5s cubic-bezier(.2, .8, .2, 1) .06s both; }
.push > :is(.top, .card, .minihead, .debtcard, section, .note), .pop > :is(.top, .card, .minihead, .debtcard, section, .note) { animation: pushIn .32s cubic-bezier(.2, .8, .2, 1) both; }
.pop > :is(.top, .card, .minihead, .debtcard, section, .note) { animation-name: popIn; }
.mnext > :is(.card, section, .note, .alerts) { animation: pushIn .3s cubic-bezier(.2, .8, .2, 1) both; }
.mprev > :is(.card, section, .note, .alerts) { animation: popIn .3s cubic-bezier(.2, .8, .2, 1) both; }
:is(.push, .pop, .mnext, .mprev) > :nth-child(3) { animation-delay: .03s; }
:is(.push, .pop, .mnext, .mprev) > :nth-child(4) { animation-delay: .06s; }
:is(.push, .pop, .mnext, .mprev) > :nth-child(n+5) { animation-delay: .09s; }
@keyframes pushIn { from { opacity: 0; transform: translateX(18px); } }
@keyframes popIn { from { opacity: 0; transform: translateX(-18px); } }
:is(.push, .ret, .mnext, .mprev) :is(.meter, .bar, .goalbar) > i { animation: fillIn .6s cubic-bezier(.2, .8, .2, 1) .12s both; transform-origin: left center; }
@keyframes fillIn { from { transform: scaleX(0); } }
.exp.fresh { animation: fresh 1.4s ease-out; border-radius: 10px; }
@keyframes fresh { 0%, 30% { background: #E3EEE8; } 100% { background: transparent; } }
@media (prefers-reduced-motion: reduce) { :is(.push, .pop, .mnext, .mprev) > *, :is(.push, .ret, .mnext, .mprev) :is(.meter, .bar, .goalbar) > i, .exp.fresh { animation: none !important; } }
.ret .tagchart { animation: chartIn .45s cubic-bezier(.2, .8, .2, 1) .08s both; }
@keyframes chartIn { from { opacity: 0; transform: scale(.94); } }
.ret .fab { animation: fabIn .3s cubic-bezier(.2, .9, .3, 1.4) .2s both; }
@keyframes retIn { from { opacity: 0; transform: translateY(10px); } }
@keyframes ringIn { from { opacity: 0; transform: rotate(-30deg) scale(.9); } }
@keyframes fabIn { from { opacity: 0; transform: scale(.5); } }
@media (prefers-reduced-motion: reduce) { .sheet, .scrim, .toast, .ret .card, .ret .ring, .ret .tagchart, .ret .fab { animation: none; } .meter i { transition: none; } }
.ring .slice, .sring .slice { transition: transform .2s cubic-bezier(.2, .9, .3, 1.3); }
/* Home (D3): the split ring in white inside the green box, with a thin outer line for what is left to spend */
.dhero { padding: 14px 16px 16px; cursor: pointer; -webkit-tap-highlight-color: transparent; }
.dhero:active { filter: brightness(1.04); }
.ughost { position: fixed; inset: 0; z-index: 60; background-color: var(--bg); background-image: var(--dots); background-size: 18px 18px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-top: env(safe-area-inset-top, 0px); }
.ughost-in { max-width: 480px; margin: 0 auto; }
.navfx { position: fixed; left: 0; top: 0; z-index: 61; pointer-events: none; overflow: visible; }
.navfx .nfl { font-family: var(--mono); font-size: 10px; fill: var(--muted); }
.navfx .nfn { font-family: "Doto", var(--mono); font-weight: 900; fill: var(--ink); }
.navghost { background: var(--bg); background-image: var(--dots); }
.udot { position: fixed; z-index: 61; border-radius: 50%; background: var(--warn); pointer-events: none; display: none; }
.upulse { position: fixed; z-index: 61; border-radius: 50%; border: 2px solid var(--warn); pointer-events: none; display: none; }
.sring { display: block; width: 100%; max-width: 256px; margin: 0 auto; overflow: visible; }
.sring .band { fill: none; stroke: rgba(255, 255, 255, .9); pointer-events: none; }
.sring .emptyw { fill: none; stroke: rgba(255, 255, 255, .14); }
.sring .stk { fill: none; stroke: rgba(255, 255, 255, .15); }
.sring .sarc { fill: none; stroke: #fff; stroke-linecap: round; }
.sring .sl1 { font-family: var(--mono); font-size: 10px; letter-spacing: 1.2px; fill: #FF8A8A; }
.sring .sv { font-family: "Doto", var(--mono); font-weight: 900; fill: #fff; }
.sring .sl2 { font-family: var(--mono); font-size: 10px; fill: #BFD6CB; }
.hpair { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; border-top: 1px solid rgba(255, 255, 255, .2); padding-top: 12px; margin-top: 10px; }
.hpair > div + div { border-left: 1px solid rgba(255, 255, 255, .2); padding-left: 12px; }
.hpair .v { font-family: "Doto", var(--mono); font-weight: 800; font-size: 22px; margin-top: 5px; line-height: 1; }
.dhero > .hnote { font-size: 12px; color: #BFD6CB; margin-top: 10px; }
.ring .band { fill: none; stroke: rgba(255, 255, 255, .8); pointer-events: none; }
.ringcard:active { background: #FAFCFB; }
.h2row { display: flex; align-items: center; justify-content: space-between; }
.h2row h2 { margin: 0; }
.chev { width: 32px; height: 32px; border-radius: 50%; border: 1px solid var(--line); display: grid; place-items: center; font-weight: 600; color: var(--ink); }
.tagp { cursor: pointer; transition: opacity .25s ease; }
.tagp.static { cursor: default; }
.tagp rect { fill: var(--surface); stroke: var(--line); transition: stroke .2s ease; }
.tagp .tn2 { font-family: var(--font); font-weight: 700; font-size: 12px; fill: var(--ink); }
.tagp .tv2 { font-family: var(--mono); font-size: 10.5px; fill: var(--muted); }
.tagp .lead2 { fill: none; stroke-width: 1.4; stroke-linejoin: round; }
.tagp .ldot { fill: var(--surface); stroke-width: 1.5; }
/* Track wheel: normal at rest; while a finger is on the ring the other pots thin and a band of light follows it */
.tagchart.select { touch-action: none; user-select: none; -webkit-user-select: none; cursor: pointer; }
.tagchart .slice.pick { cursor: pointer; transition: stroke-width .22s ease; }
.tagchart.active .slice.pick { stroke-width: 26; }
.tagchart.active .slice.pick.on { stroke-width: 50; }
.tagchart.active .tagp:not(.on) { opacity: .35; }
.tagchart .trail { fill: none; stroke: rgba(255, 255, 255, .8); stroke-linecap: butt; pointer-events: none; transition: opacity .3s ease; }
.tagchart:not(.active) .trail { opacity: 0; }
.tagp.on rect { stroke: var(--ink); stroke-width: 1.5; }
.slice.pick:focus, .tagp:focus, .ringcard:focus:not(:focus-visible) { outline: none; }
[data-sel], [data-open], [data-pot], button, .ringcard, svg { -webkit-tap-highlight-color: transparent; }
.tagp:focus-visible rect { stroke: var(--green); stroke-width: 2; }
#potPanel.enter { animation: rise .35s ease-out; }
/* day by day chart */
.dc { display: block; width: 100%; height: auto; margin-top: 6px; touch-action: pan-y; user-select: none; -webkit-user-select: none; }
.dc .dbar { fill: var(--green); transition: opacity .15s; }
.dc .dbar.over { fill: var(--amber); }
.dc .dbar.zero { fill: var(--line); }
.dc.active .dbar:not(.hot) { opacity: .4; }
.dc .fut { fill: var(--line); }
.dc .allow { stroke: var(--muted); stroke-width: 1; stroke-dasharray: 3 4; opacity: .7; }
.dc .axis { font-family: var(--mono); font-size: 10px; fill: var(--muted); }
.dc .axis.now { fill: var(--warn); }
.dc .xh { stroke: var(--ink); stroke-width: 1; opacity: 0; }
.dc.active .xh { opacity: .25; }
.dcstats { display: grid; grid-template-columns: repeat(auto-fit, minmax(90px, 1fr)); gap: 10px; margin-top: 12px; padding-top: 12px; border-top: 1px dashed var(--line); }
.dcstats .label { font-size: 10px; }
.dcstats .num { font-family: var(--mono); font-size: 14px; font-weight: 500; margin-top: 2px; }
/* pot sheet on the breakdown page */
:root { --peek: calc(196px + 66px + env(safe-area-inset-bottom, 0px)); }
.psheet { position: fixed; z-index: 7; left: 0; right: 0; bottom: 0; height: calc(100dvh - 176px - env(safe-area-inset-top, 0px)); background: var(--surface); border-radius: 26px 26px 0 0; border-top: 1px solid var(--line); box-shadow: 0 -8px 24px rgba(21, 35, 28, .1); transform: translateY(100%); }
.psheet.peek { transform: translateY(calc(100% - var(--peek))); }
.psheet.full { transform: none; }
.psheet.dragging { transition: none; }
.psin { max-width: 480px; margin: 0 auto; height: 100%; display: flex; flex-direction: column; }
.pshead { padding: 8px max(20px, env(safe-area-inset-left, 0px)) 6px; touch-action: none; user-select: none; -webkit-user-select: none; cursor: grab; }
.psgrab { width: 38px; height: 4px; border-radius: 2px; background: var(--line); margin: 0 auto 8px; }
.psdots { display: flex; justify-content: center; gap: 6px; margin-bottom: 10px; }
.psdots i { width: 5px; height: 5px; border-radius: 50%; background: var(--line); transition: background .2s, transform .2s; }
.psdots i.on { background: var(--warn); transform: scale(1.3); }
.psstat { margin-top: 10px; }
.psstat .meter { margin-top: 0; }
.pshint { font-family: var(--mono); font-size: 11px; color: var(--muted); text-align: center; margin-top: 12px; }
.psbody { flex: 1; overflow-y: auto; overscroll-behavior: contain; touch-action: pan-y; padding: 0 max(16px, env(safe-area-inset-left, 0px)) calc(96px + env(safe-area-inset-bottom, 0px)); opacity: 0; pointer-events: none; }
.psbody .card { margin-top: 10px; }
.psopen .fab { display: none; }
.obdots { display: flex; gap: 6px; justify-content: center; margin: 4px 0 2px; }
.obdots i { width: 7px; height: 7px; border-radius: 50%; background: var(--line); transition: background .25s, transform .25s; }
.obdots i.done { background: var(--green); }
.obdots i.on { background: var(--warn); transform: scale(1.25); }
.obcard h2 { margin-bottom: 4px; }
.obnav { display: flex; justify-content: space-between; align-items: center; margin-top: 16px; }
.filebtn { display: inline-flex; align-items: center; cursor: pointer; }
/* wide screens (laptop, desktop): keep sheets and the + button with the app column instead of the window edges */
@media (min-width: 600px) {
  .psheet, .sheet { left: calc(50% - 260px); right: calc(50% - 260px); border-left: 1px solid var(--line); border-right: 1px solid var(--line); }
  .fab { right: calc(50% - 240px + 8px); }
}
/* laptop layout (E3): top bar, dashboard grid on Home, pot panel on the right. Only from 1100px wide. */
#app.desk { max-width: 1440px; padding-bottom: 40px; --dbar-h: 68px; }
.desk > nav, .desk > .fab { display: none; }
.dbar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 12; margin-inline: calc(-1 * max(16px, env(safe-area-inset-left, 0px))); background: var(--surface); border-bottom: 1px solid var(--line); }
.dbar-in { max-width: 1440px; margin: 0 auto; height: var(--dbar-h); padding-inline: max(16px, env(safe-area-inset-left, 0px)); display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 20px; }
.dtabs { display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; padding: 4px; background: var(--ink); border-radius: 999px; }
.dtabs button { height: 36px; padding: 0 24px; border-radius: 999px; border: 0; background: transparent; font-family: var(--mono); font-size: 13px; font-weight: 500; color: #9DB0A5; }
.dtabs button[aria-current=page] { background: #fff; color: var(--ink); }
.dtabs button:hover:not([aria-current]) { color: #fff; }
.dright { display: flex; align-items: center; justify-content: flex-end; gap: 10px; }
.dright .btn { display: inline-flex; align-items: center; gap: 6px; }
.dright .monthnav { margin-right: 6px; }
.dwrap { display: grid; grid-template-columns: minmax(0, 1fr); gap: 18px; align-items: start; padding-top: 18px; }
.dwrap.open { grid-template-columns: minmax(0, 1fr) 420px; }
.desk .top { position: static; padding-top: 4px; background: transparent; }
.desk .dmain > .card:first-child, .desk .dmain > .top + .card { margin-top: 4px; }
/* Laptop Home (H1): the green panel across the top */
.dhome .dband { display: grid; grid-template-columns: clamp(200px, 19vw, 290px) minmax(0, 1fr) clamp(260px, 24vw, 360px); gap: clamp(20px, 2.4vw, 36px); align-items: center; padding: 22px 30px; margin: 0; }
.dband .sring { max-width: 290px; }
.fixedc .sl1 { fill: var(--mint); }
.dlts { display: block; font-family: "Doto", var(--mono); font-weight: 900; font-size: clamp(48px, 5.8vw, 88px); line-height: 1; margin: 16px 0 16px; color: #fff; white-space: nowrap; }
.dband .meter { display: block; background: rgba(255, 255, 255, .18); margin-top: 0; }
.dband .meter i { background: #fff; }
.dband .meter::after { background: var(--green); }
.dband .meter.warn i { background: #FFC46B; }
.dband .meter.over i { background: #FF8A8A; }
.dband .dbm { height: 10px; }
.dbrow { display: flex; justify-content: space-between; gap: 12px; font-family: var(--mono); font-size: 11.5px; color: var(--mint); margin-top: 10px; }
.dbstats { display: flex; gap: clamp(20px, 3vw, 44px); margin-top: 26px; }
.dbstats .label { color: var(--mint); }
.dbstats .v { font-family: "Doto", var(--mono); font-weight: 800; font-size: 22px; margin-top: 8px; color: #fff; }
.dbpots { border-left: 1px solid rgba(255, 255, 255, .2); padding-left: clamp(20px, 2.2vw, 30px); display: grid; gap: 18px; }
.dpl { all: unset; display: grid; gap: 8px; cursor: pointer; border-radius: 10px; }
.dpl:focus-visible { outline: 2px solid #fff; outline-offset: 6px; }
.dpl-t { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; }
.dpl .n { font-weight: 700; font-size: 14px; color: #fff; }
.dpl:hover .n { text-decoration: underline; text-underline-offset: 3px; }
.dpl .u { font-family: var(--mono); font-size: 11px; color: var(--mint); }
.dpl .v { font-family: "Doto", var(--mono); font-weight: 800; font-size: 30px; color: #fff; line-height: 1; }
.dhome .dcols2 { display: grid; grid-template-columns: minmax(0, 1.15fr) minmax(0, 1fr) minmax(0, .8fr); gap: 0 18px; align-items: start; }
.dhome .dc3 .tiles4 { grid-template-columns: repeat(2, minmax(0, 1fr)); margin-top: 12px; }
.dnotes h2 { margin-bottom: 4px; }
.dnotes .alert { background: none; border: 0; border-radius: 0; padding: 8px 0 0; margin: 0; font-weight: 500; color: var(--ink); }
.dnotes .alert.warn::before { background: var(--amber); }
.dnotes .alert.over::before { background: var(--warn); }
.dnotes .alert.info::before { background: var(--muted); }
.dnotes .alert.over { color: var(--warn); }
.kv.negv .a { color: var(--warn); }
/* with a pot open beside it: the pots go under the number, and the lower part uses two columns */
.dwrap.open .dhome .dband { grid-template-columns: clamp(160px, 14vw, 220px) minmax(0, 1fr); }
.dwrap.open .dhome .dbpots { grid-column: 1 / -1; grid-template-columns: repeat(3, minmax(0, 1fr)); border-left: 0; padding-left: 0; border-top: 1px solid rgba(255, 255, 255, .2); padding-top: 18px; gap: 24px; }
.dwrap.open .dlts { font-size: clamp(40px, 4vw, 64px); }
.dwrap.open .dhome .dcols2 { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); }
.dwrap.open .dhome .dc3 { grid-column: 1 / -1; }
.dwrap.open .dhome .dc3 .tiles4 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
/* Tiles keep their place. With a pot open they sit four across when each can still be at least 104px wide,
   otherwise two by two in the same spot. Their numbers shrink only as much as a tile needs (fitTile). */
.dhome .dc3 { container: dtiles / inline-size; }
@container dtiles (min-width: 446px) { .dwrap.open .dhome .dc3 .tiles4 { grid-template-columns: repeat(4, minmax(0, 1fr)); } }
.desk .tiles4 .tile { min-width: 0; }
.desk .tiles4 .tv { white-space: nowrap; }
.desk .tiles4 .label, .desk .tiles4 .tn, .desk .tiles4 .ts { max-width: 100%; overflow-wrap: break-word; }
/* the panel */
.dpanel { position: sticky; top: calc(var(--dbar-h) + 18px + env(safe-area-inset-top, 0px)); max-height: calc(100dvh - var(--dbar-h) - 36px - env(safe-area-inset-top, 0px)); overflow-y: auto; overscroll-behavior: contain; background: var(--surface); border: 1px solid var(--line); border-radius: 24px; padding: 18px 18px 22px; }
.dpanel.enter { animation: dpIn .28s cubic-bezier(.2, .9, .3, 1) both; }
@keyframes dpIn { from { opacity: 0; transform: translateX(40px); } }
.dp-head { display: grid; grid-template-columns: 12px minmax(0, 1fr) auto 40px; gap: 10px; align-items: center; }
.dp-head .sw { width: 12px; height: 12px; border-radius: 50%; display: block; }
.dp-body .card { margin-top: 12px; padding: 16px; border-radius: 20px; background: var(--bg); }
.dp-body .card .card { background: var(--surface); }
/* home dashboard */
.dhome .dtop { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(0, 3fr); gap: 12px; align-items: stretch; }
.dhome .dtop > .hero { margin: 0; display: flex; flex-direction: column; justify-content: center; }
.dhome .dtop .tiles4 { margin: 0; grid-template-columns: repeat(4, minmax(0, 1fr)); }
.dwrap.open .dhome .dtop { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); }
.dwrap.open .dhome .dtop .tiles4 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.dhome .dtop .tiles4 .tile { min-height: 104px; }
.dhome .dcols { display: grid; grid-template-columns: minmax(0, 1.15fr) minmax(0, 1fr) minmax(0, .85fr); gap: 0 16px; align-items: start; }
.dwrap.open .dhome .dcols { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); }
.dwrap.open .dhome .dc1 { grid-row: span 2; }
.dwrap.open .dhome .dc3 { grid-column: 2; }
.dhome .dc3 .alert:first-child { margin-top: 12px; }
.dhome .debtcard { margin-top: 10px; }
.dhome .debtcard.on { border-color: var(--green); box-shadow: inset 0 0 0 1px var(--green); }
.dring .tagchart { margin-top: 6px; }
.debtcard:hover, .desk .sp:hover, .desk .tiles4 .tile:hover { border-color: #C5D1CA; }
/* goals and setup: cards flow into columns */
.desk .dmain.tab-goals, .desk .dmain.tab-setup { column-gap: 16px; }
.desk .dmain.tab-goals { column-count: 2; }
.desk .dmain.tab-setup { column-count: 3; }
.desk .dwrap.open .dmain.tab-setup { column-count: 2; }
.desk .dwrap.open .dmain.tab-goals { column-count: 1; }
.desk .dmain:is(.tab-goals, .tab-setup) > * { break-inside: avoid; }
.desk .dmain:is(.tab-goals, .tab-setup) > .top { column-span: all; }
.desk .dmain:is(.tab-goals, .tab-setup) > .card { display: inline-block; width: 100%; margin: 0 0 14px; }
.desk .dmain.det { max-width: 760px; width: 100%; margin-inline: auto; }
.desk .dmain:is(.tab-goals, .tab-setup) > .top { display: none; }
/* sheets become a dialog in the middle of the screen */
.desk .sheet { left: calc(50% - 250px); right: calc(50% - 250px); top: 9vh; bottom: auto; max-height: 82vh; border-radius: 26px; padding-bottom: 22px; box-shadow: 0 24px 60px rgba(21, 35, 28, .22); border: 1px solid var(--line); }
.desk .sheet .grab { display: none; }
.desk:is(.push, .pop, .mnext, .mprev) .dmain > *, .desk:is(.mnext, .mprev) .dhome > * { animation: pushIn .3s cubic-bezier(.2, .8, .2, 1) both; }
.desk:is(.pop, .mprev) .dmain > *, .desk.mprev .dhome > * { animation-name: popIn; }
/* motion: the tab pill slides, the panel content cross-fades between pots, bars fill when a pot opens,
   dialogs rise a little, cards lift a pixel under the mouse */
.dtabs { position: relative; }
.dtabs button { position: relative; z-index: 1; }
.dtabs button[aria-current=page] { background: transparent; }
.dind { position: absolute; z-index: 0; top: 4px; bottom: 4px; left: 4px; width: calc((100% - 16px) / 3); border-radius: 999px; background: #fff; transform: translateX(calc(var(--i) * (100% + 4px))); }
.dpanel.swap > * { animation: dpSwap .24s cubic-bezier(.2, .8, .2, 1) both; }
.dpanel.swap > .dp-body { animation-delay: .04s; }
@keyframes dpSwap { from { opacity: 0; transform: translateY(6px); } }
:is(.dpanel.enter, .dpanel.swap) :is(.meter, .bar) > i { animation: fillIn .6s cubic-bezier(.2, .8, .2, 1) .12s both; transform-origin: left center; }
.desk .sheet { animation: dlgIn .24s cubic-bezier(.2, .9, .3, 1) both; }

/*LOGIC-START*/
// All money is stored as integer grosze (1 PLN = 100) so splits never drift by a cent.
// Anything that is not a real, sane amount (text, Infinity, 1e308) becomes NaN, which every form refuses.
const MAX_G = 1e13; // 100 billion PLN
const toG = (pln) => { const g = Math.round(Number(pln) * 100); return Number.isFinite(g) && Math.abs(g) <= MAX_G ? g : NaN; };

// Splits `total` grosze by integer weights. The leftover grosze go to the largest remainders,

  const sum = weights.reduce((a, b) => a + b, 0);
  if (sum <= 0 || total <= 0) return weights.map(() => 0);
  const raw = weights.map((w) => (total * w) / sum);
  const base = raw.map(Math.floor);
  let left = total - base.reduce((a, b) => a + b, 0);
  const order = raw.map((r, i) => [r - base[i], i]).sort((a, b) => b[0] - a[0]);
  for (let k = 0; left > 0; k = (k + 1) % order.length, left--) base[order[k][1]]++;
  return base;
}

function defaultSettings() {
  return {
    percents: { rent: 1500, groceries: 2000, savings: 2000, investing: 2000, everyday: 1500, fun: 1000 },
    sub: { emergency: 3500, travel: 2167, general: 2167, big: 2166 },
    fixed: [],
    rentTarget: 0,
    cycleDay: 13,

// `bills` is the month's own saved bill list when it has one, so past months keep the bills they had.
// Paused bills are skipped.
// `debtG` is this month's debt repayments (from debtPlan), also taken off the top before the split.
// `bufG` is what goes to the income buffer this cycle while it is filling, also taken off the top.
// `yG` is what is set aside for yearly costs this cycle (from yearlyStep), taken off after debt.

  const fixedTotal = (bills || s.fixed).filter((f) => !f.paused).reduce((a, f) => a + f.g, 0);
  const debtTotal = Math.max(0, Math.min(debtG, splitTotal - fixedTotal));

  const bufTotal = Math.max(0, Math.min(bufG, splitTotal - fixedTotal - debtTotal - yearlyTotal));
  const toSplit = Math.max(0, splitTotal - fixedTotal - debtTotal - yearlyTotal - bufTotal);
  const parts = allocate(toSplit, POT_ORDER.map((k) => s.percents[k]));
  const pots = {};
  POT_ORDER.forEach((k, i) => (pots[k] = parts[i]));

  SUB_ORDER.forEach((k, i) => (sub[k] = subParts[i]));

  // from the cycle they were added (start) to the cycle they were finished (end).
  const special = {};
  // In the cycle a pot is finished, it keeps only what it had then (endAlloc); later income goes to Big purchases.
  // Together they can never take more than Big purchases has (a pot finished and a new one added in the same cycle).
  let bigLeft = sub.big;
  if (key) (s.specials || []).forEach((x) => {
    if (!(x.start <= key && (!x.end || key <= x.end))) return;
    let g = Math.floor((sub.big * x.share) / 10000);

    g = Math.max(0, Math.min(g, bigLeft)); bigLeft -= g;
    special[x.id] = g;

  const one = {};
  income.forEach((e) => { if (isOnePot(e)) one[e.pot] = (one[e.pot] || 0) + e.g; });
  Object.keys(one).forEach((k) => { if (k in sub) { sub[k] += one[k]; pots.savings += one[k]; } else pots[k] += one[k]; });

// ---------- bills ticked off ----------
// m.bills = { [billId]: 'YYYY-MM-DD' (paid that day) | 'skip' (not paid that cycle) | null (not ticked yet) }.
// A bill is set aside on pay day whether it is ticked or not. A skipped bill takes nothing that cycle,
// so its money stays in that cycle's split.
// Pots an income entry can go into whole (instead of the salary split). Spending pots, Investing, and the savings sub pots.
const ONE_POTS = ['groceries', 'everyday', 'fun', 'emergency', 'travel', 'general', 'big', 'investing'];
// The income entries that go through the salary split (no pot).
const isOnePot = (e) => !!e.pot && ONE_POTS.includes(e.pot);
const splitInc = (m) => ((m && m.income) || []).filter((e) => !isOnePot(e));

// Each debt is { id, name, owed, pay, start, paused }. From the cycle it was added (`start`), every paid cycle
// takes `pay` off the top until the debt is cleared; the last payment is only what is left.
// A past month that was frozen (m.debt) keeps the payments it had, so editing a debt never rewrites history.
// Debt payments are worked out in the same walk as the income buffer (planAll, below), because a cycle that the
// buffer pays for counts as a paid cycle even when no income came in during it.
function debtPlan(st) { return planAll(st).DP; }
const debtOf = (DP, k) => (DP.byMonth[k] ? DP.byMonth[k].total : 0);

// The same goes for the savings sub pot weights (m.subw).
const sFor = (st, m) => (m && (m.pct || m.subw) ? Object.assign({}, st.settings, m.pct ? { percents: m.pct } : {}, m.subw ? { sub: m.subw } : {}) : st.settings);

// settings.yearly = [{ id: 'y…', name, start, end, plan: [{ from, g, due }], ask }]. Each cost is saved for off the top,
// like a bill. Every cycle it takes what is still needed divided by the cycles left up to and including `due`,
// rounded up to whole złoty, so a cost added late catches up and then settles near 1/12. A cost that is fully
// saved takes nothing. Past its due date and still short, it takes the rest at once.
// `plan` is a history: the entry in force for a cycle is the last one whose `from` is not after it, so rolling a
// cost on a year (or pausing it while you decide) never rewrites past cycles. An entry with g 0 takes nothing.
// Paying is an expense whose pot is the cost's id. If the money left after bills and debt is not enough for every
// cost, what there is gets shared by what each wanted.
const yPlanAt = (y, k) => { let p = null; (y.plan || []).forEach((x) => { if (x.from <= k) p = x; }); return p; };

  const items = st.settings.yearly || [], act = items.filter((y) => yActive(y, k));
  const want = act.map((y) => {
    const p = yPlanAt(y, k); if (!p || !p.g || !p.due) return 0;
    const need = Math.max(0, p.g - (Y.bal[y.id] || 0)); if (!need) return 0;
    const left = Math.max(1, monthsBetween(k, p.due) + 1);
    return Math.min(need, Math.ceil(need / left / 100) * 100);

  act.forEach((y, i) => { if (got[i]) by[y.id] = got[i]; });
  items.forEach((y) => { Y.bal[y.id] = (Y.bal[y.id] || 0) + (by[y.id] || 0) + moveNet(m, y.id) - spentFrom(m, y.id); });
  const total = Object.values(by).reduce((a, b) => a + b, 0);

}
const yearlyOf = (BP, k) => (BP.yearly.byMonth[k] ? BP.yearly.byMonth[k].total : 0);
// ---------- income buffer ----------
// settings.buffer = { on, start, end, share, pays: [{ from, g }] }.
// Filling: from `start`, `share` of each cycle's money (after bills and debt) goes to the buffer until it holds
// one month's pay. Moves in (top-ups) count. The cycle after it is full, it goes live:
// at the start of each cycle the buffer pays out your steady pay (or what it holds, if less),
// and everything that comes in during the cycle goes into the buffer. `end` turns it off from that cycle.
const payFor = (B, k) => { let g = 0; (B.pays || []).forEach((x) => { if (x.from <= k) g = x.g; }); return g; };
// The same walk also works out the yearly costs (out.yearly), because what they can take depends on the money a
// cycle really has: the buffer's pay in a live cycle, the income otherwise.
// Every cycle from the first one with data up to now (or the last one with data, if later), with no gaps, so the
// buffer still pays you, and debt and yearly costs still come off, in a cycle where nothing has been logged yet.
function cycleKeys(st) {
  const ks = Object.keys(st.months).sort(); if (!ks.length) return [];
  let now = ''; try { now = typeof nowCycle === 'function' ? nowCycle() : ''; } catch (e) {}
  const last = [ks[ks.length - 1], now].sort().pop(), out = [];
  for (let k = ks[0]; k <= last && out.length < 1200; k = nextMonthKey(k)) out.push(k);

}
// One walk through the cycles in order works out debt payments, the income buffer and the yearly costs together,
// since each depends on the money a cycle really has: the buffer's pay in a live cycle, the income otherwise.
function planAll(st) {
  const debts = st.settings.debts || [], left = {}, paid = {}, byMonth = {}, afterMonth = {};
  debts.forEach((d) => { left[d.id] = d.owed; paid[d.id] = 0; });
  const B = st.settings.buffer, out = { on: !!(B && B.on), bal: 0, byMonth: {}, live: null };
  const Y = (out.yearly = { byMonth: {}, bal: {} });

  const hasB = !!(B && B.start);

  cycleKeys(st).forEach((k) => {
    const m = st.months[k] || { income: [] }, sInc = splitInc(m), inc = sInc.reduce((a, e) => a + e.g, 0);
    const inB = hasB && k >= B.start && !(B.end && k >= B.end), pay = hasB ? payFor(B, k) : 0;
    const isLive = inB && !!live && k >= live;
    const start = isLive ? bal + moveNet(m, 'buffer') : 0, release = isLive ? Math.max(0, Math.min(start, pay)) : 0;
    // debt: a paid cycle takes each debt's payment until it is cleared. A frozen past cycle keeps what it had.
    if (sInc.length || release > 0) {
      const by = {};
      // A payment can only be what the cycle really has after its bills. If the money runs short, the debts
      // get what there is (in the order they were added) and the rest stays owed, so "still owed" never drops
      // by money that was not actually paid.
      const money = isLive ? release : inc;
      let room = Math.max(0, money - billsOf(st, m).filter((f) => !f.paused).reduce((a, f) => a + f.g, 0));
      if (m.debt) Object.keys(m.debt).forEach((id) => (by[id] = m.debt[id]));
      else debts.forEach((d) => { if (!d.paused && d.start <= k && left[d.id] > 0 && room > 0) { const g = Math.min(d.pay, left[d.id], room); by[d.id] = g; room -= g; } });
      Object.keys(by).forEach((id) => { if (id in left) { left[id] = Math.max(0, left[id] - by[id]); paid[id] += by[id]; } });
      byMonth[k] = { by, total: Object.values(by).reduce((a, b) => a + b, 0) };

    const yG = yearlyStep(st, k, m, avail, Y);

    if (!isLive) {
      const base = Math.max(0, avail - yG);
      const contrib = Math.max(0, Math.min(Math.floor((base * (B.share || 1000)) / 10000), pay - bal));

}
function bufferPlan(st) { return planAll(st).BP; }
const bufOf = (BP, k) => BP.byMonth[k] || null;
// The split for a cycle, going through the buffer: live cycles split the buffer's pay, filling cycles lose the share.
function monthCalcOf(st, k, DP, BP) {
  const m = st.months[k] || { income: [] };

  const inc = b && b.mode === 'live' ? (b.release ? [{ g: b.release }] : []).concat((m.income || []).filter(isOnePot)) : (m.income || []);

}
// Balance of each special savings pot: its share of each month's split, plus money moved in, minus spending.
function specialBalances(st) {
  const bal = {}, sp = st.settings.specials || [];
  if (!sp.length) return bal;
  sp.forEach((x) => (bal[x.id] = 0));
  const DP = debtPlan(st), BP = bufferPlan(st, DP);
  cycleKeys(st).forEach((k) => {
    const m = st.months[k] || { income: [] };
    const c = monthCalcOf(st, k, DP, BP);
    sp.forEach((x) => { bal[x.id] += (c.special[x.id] || 0) + moveNet(m, x.id) - (m.expenses || []).filter((e) => e.pot === x.id).reduce((a, e) => a + e.g, 0); });

// (rentCushion months of expected rent, 3 by default). Anything past that goes to the Emergency fund.
// With no expected rent set there is no cap, so it all stays in the pot. Moves in and out count too.
// A closed cycle keeps the expected rent and cushion it used (m.rentT, m.rentCush, saved when either is edited),
// so changing them later never moves money in cycles that are already closed.
function rentAt(st, k) {
  const s = st.settings, m = st.months[k] || {};

function rentPlan(st) {

    const m = st.months[k] || { income: [] }, c = monthCalcOf(st, k, DP, BP), R = rentAt(st, k), capK = R.rent * R.months;
    const add = c.pots.rent, keep = capK > 0 ? Math.max(0, Math.min(add, capK - bal)) : add;

//   left   = budget - spent
// What is left at month end carries into next month. A negative left (overspending) carries as a debt.
// On the reset day that starts the next cycle (the 13th by default), 20% of any positive leftover is taken out

// started yet has not had its sweep.
const SPEND = ['groceries', 'everyday', 'fun'];

// fun money. Entries logged before this rule (no keep flag) keep the split they were logged with, so past cycles
// do not change. Pass the entry as x; a bare amount (no entry) is treated as a new gain.

}

//   waiting      set aside but not moved to the brokerage: set aside - deposits + withdrawals (income paid out is its own line, incomeCash)
//   account      what the brokerage holds: the last portfolio value you typed, plus anything logged since (estimate)

//                and the difference a typed portfolio value makes against the estimate

  let s = `<svg class="lc pl dch ${cls || ''}" id="${id}" viewBox="0 0 ${W} ${H}" role="img" aria-label="${label}">`;
  for (let v = min; v <= max + 1; v += step) s += `<line class="grid" x1="${L}" x2="${W - R}" y1="${Y(v).toFixed(1)}" y2="${Y(v).toFixed(1)}"/><text class="axis" x="${L - 6}" y="${(Y(v) + 3).toFixed(1)}" text-anchor="end">${fmtK(v)}</text>`;
  for (let i = 0; i <= 3; i++) { const t = t0 + ((t1 - t0) * i) / 3; s += `<text class="axis" x="${X(t).toFixed(1)}" y="${H - 6}" text-anchor="${i === 0 ? 'start' : i === 3 ? 'end' : 'middle'}">${new Date(t).toLocaleString('en-GB', { day: 'numeric', month: 'short' })}</text>`; }
  return { s, X, Y, W, H, L, R, T, B };
}

function valChart(B) {

    read: V.map((v) => { const p = putAt(dOf(v.date).getTime()), gl = v.g - p; return [fmtN(v.g), `put in ${fmtN(p)} · ${gl >= 0 ? '+' : '−'}${fmtN(Math.abs(gl))}`, dLong(v.date), gl >= 0 ? 'up' : 'down']; }) };

function dchRead(id, i) {
  const C = DCH[id]; if (!C || !C.read[i]) return;

function dchMove(e) {

  const C = DCH[svg.id], r = svg.getBoundingClientRect(), x = ((e.clientX - r.left) / r.width) * C.W;
  let i = 0; C.xs.forEach((v, j) => { if (Math.abs(v - x) <= Math.abs(C.xs[i] - x)) i = j; });
  svg.classList.add('active');
  svg.querySelector('.xh').setAttribute('x1', C.xs[i]); svg.querySelector('.xh').setAttribute('x2', C.xs[i]);
  svg.querySelector('.xd').setAttribute('cx', C.xs[i]); svg.querySelector('.xd').setAttribute('cy', C.ys[i]);

}
function dchLeave(e) { const svg = e.target.closest && e.target.closest('svg.dch'); if (!svg || !DCH[svg.id]) return; svg.classList.remove('active'); dchRead(svg.id, DCH[svg.id].read.length - 1); }

// Download everything as one JSON file, spending as a CSV, or put a backup file back.
// Files go through the platform's download prompt when it is available, otherwise a normal browser download.
async function offerFile(filename, text) {

    if (dl) { await dl.save({ filename, data: text }); toast('Saved ' + filename); return; }
  } catch (e) { if (e && e.code === 'declined') return; if (e && e.code === 'rate_limited') { toast('A save is already waiting for you'); return; } }
  try {
    const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([text], { type: filename.endsWith('.csv') ? 'text/csv' : 'application/json' }));
    a.download = filename; document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
  } catch (e) { toast('Downloads are not available here'); }
}

      }
    }
    const forPrev = (t === 'dep' || t === 'wd') && (f.querySelector('input[name="ixFor"]:checked') || {}).value === 'prev';
    const rec = { t, date, forKey: forPrev ? addMonths(cycleKeyOf(dOf(date)), -1) : null, amt: t === 'adj' ? sign * amt : amt, cur, rate, rateDate, acct: (document.getElementById('ixAcct').value || '').trim().slice(0, 40), note, paidOut: t === 'div' && !!(document.getElementById('ixPaid') || {}).checked };
    if (inv) { rec.inv = inv; rec.st = stv === 'sold' || stv === 'part' ? stv : 'hold'; }
    if (itxEdit) {
      const x = (state.itx || []).find((y) => y.id === itxEdit); if (!x) return;
      if (x.est && x.date !== rec.date) rec.est = false;
      // cleared with an empty value, not deleted, so a sync with an older copy cannot bring the name back
      if (!inv && ('inv' in x || 'st' in x)) { rec.inv = ''; rec.st = null; }
      Object.assign(x, rec, { edited: Date.now() });
    } else (state.itx = state.itx || []).push(Object.assign({ id: uid(), at: Date.now() }, rec));
    const wasEdit = !!itxEdit;
    sheetOpen = false; itxEdit = null; armedTx = null; save();
    toast(wasEdit ? 'Entry updated. Totals worked out again' : cur !== 'PLN' && rate == null ? `${ITX_TYPES[t].n} saved. Add the exchange rate to count it` : `${ITX_TYPES[t].n} saved`);
    return render();
  } else if (id === 'debtForm') {
    const name = document.getElementById('dName').value.trim();
    const owed = toG(document.getElementById('dOwed').value), pay = toG(document.getElementById('dPay').value);
    if (!name || !(owed > 0) || !(pay > 0)) return;
    freezePastDebts();
    state.settings.debts = state.settings.debts || [];
    state.settings.debts.push({ id: uid(), name, owed, pay, start: nowCycle() });
    armedDebt = null; save(); render();
  } else if (id === 'billForm') {
    const g = toG(document.getElementById('bAmt').value);
    const name = document.getElementById('bName').value.trim();
    if (!name || !(g > 0)) return;
    freezePastBills(); state.settings.fixed.push({ id: uid(), name, g }); armedBill = null; save(); render();
  } else if (id === 'openForm') {
    const g = toG(document.getElementById('openAmt').value);
    if (!(g > 0)) return;
    const parts = allocate(g, SUB_ORDER.map((k) => state.settings.sub[k]));
    state.openingSub = {}; SUB_ORDER.forEach((k, i) => (state.openingSub[k] = parts[i]));
    save(); render();
  }
});

document.addEventListener('change', (e) => {
  const t = e.target;
  if (t.id === 'restoreFile') { if (t.files && t.files[0]) readBackup(t.files[0]); return; }
  if (t.name === 'incWhere' || t.name === 'incPot') return incSheetSync();
  if (t.id === 'inCur') { const rr = document.getElementById('rateRow'); rr.hidden = t.value === 'PLN'; document.getElementById('rateCur').textContent = t.value; return; }
  if (t.dataset.pct) { freezePastSplit(); state.settings.percents[t.dataset.pct] = pctIn(t.value); save(); render(); }
  else if (t.dataset.sub) { freezePastSub(); state.settings.sub[t.dataset.sub] = pctIn(t.value); save(); render(); }
  else if (t.id === 'cycleDay') {
    const d = Math.round(Number(t.value));
    if (!(d >= 1 && d <= 28)) { toast('Pick a day from 1 to 28'); return render(); }
    // A new reset day applies from the next cycle; closed cycles keep the day they used and nothing dated up to today
    // is re-filed. Before anything is logged (first setup), it applies at once with no history, as there is no past.
    const before = JSON.stringify([state.settings.cycleDay, state.settings.dayHist || null]);
    const logged = Object.values(state.months).some((m) => (m.income || []).length || (m.expenses || []).length || (m.moves || []).length) || (state.itx || []).length || (state.invest || []).length;
    if (!logged) { state.settings.cycleDay = d; delete state.settings.dayHist; save(); toast(`Cycles start on day ${d}`); return render(); }
    // The current cycle keeps its start. The next cycle keeps the start it already has when the new day would make it
    // start today or earlier (a change made earlier in this cycle may have stretched it), so this cycle never ends in the past.
    const C = nowCycle(), N = nextMonthKey(C), wasC = dayFor(C), wasN = dayFor(N), K = dayChangeKey(new Date(), d);
    const h = (Array.isArray(state.settings.dayHist) ? state.settings.dayHist : []).filter((e) => e && e.until <= C);
    h.push({ until: N, day: wasC });
    if (K !== N) h.push({ until: K, day: wasN });
    state.settings.cycleDay = d;
    const ch = compactDayHist(h, d);
    if (ch.length) state.settings.dayHist = ch; else delete state.settings.dayHist;
    // Entries dated after today are not history: they go to the cycle their date now falls in.
    const today = isoOf(new Date());
    Object.keys(state.months).forEach((k) => ['expenses', 'moves'].forEach((f) => {
      const list = state.months[k][f]; if (!list) return;
      state.months[k][f] = list.filter((e) => {
        if (!e.iso || e.iso <= today) return true;
        const nk = cycleKeyOf(new Date(e.iso + 'T12:00:00')); if (nk === k) return true;
        const m = (state.months[nk] = state.months[nk] || { income: [] }); (m[f] = m[f] || []).push(e); return false;
      });
    }));
    const end = cycleRange(C)[1], start = cycleRange(K)[0];
    // A cycle under 14 days still takes a full month of bills and gets its own grade: say so (nothing is changed).
    const days = (k) => { const r = cycleRange(k); return Math.round((r[1] - r[0]) / 86400000) + 1; };
    const short = [[C, 'This cycle'], [N, 'The next cycle']].filter(([k]) => k < K).map(([k, n]) => [n, days(k)]).find(([, n]) => n < 14);
    const warn = short ? ` ${short[0]} is only ${short[1]} day${short[1] === 1 ? '' : 's'} long and still takes a full month of bills.` : '';
    save(); toast(JSON.stringify([state.settings.cycleDay, state.settings.dayHist || null]) === before ? `Cycles start on day ${d}, as before` : `Cycles start on day ${d} from ${dShort(start)}. This cycle ends on ${dShort(end)}.${warn}`); render();
  }
  else if (t.id === 'rentT') { freezePastRent(); state.settings.rentTarget = toG(t.value) || 0; save(); render(); }
  else if (t.id === 'bufPay' && state.settings.buffer && state.settings.buffer.on) {
    const g = toG(t.value), B = state.settings.buffer, now = nowCycle();
    if (!(g > 0)) return render();
    B.pays = (B.pays || []).filter((x) => x.from !== now).concat([{ from: now, g }]).sort((a, b) => a.from.localeCompare(b.from));
    save(); toast('Monthly pay set to ' + fmt(g)); render();
  }
  else if (t.id === 'rentCush') { freezePastRent(); const n = Math.round(Number(t.value)); state.settings.rentCushion = n >= 0 && n <= 12 ? n : 3; save(); render(); }
});

document.addEventListener('pointermove', lcMove);
document.addEventListener('pointerdown', lcMove);
document.addEventListener('pointerleave', lcLeave, true);
document.addEventListener('pointerup', (e) => { if (e.pointerType !== 'mouse') lcLeave(e); });
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape' && document.getElementById('hpop')) return hpClose();
  if (e.key === 'Escape' && sheetOpen) return closeSheetAnim();
  if (e.key === 'Escape' && deskPot && isDesk()) return deskClose();
  if ((e.key === 'Enter' || e.key === ' ') && e.target.dataset && e.target.dataset.expedit) { e.preventDefault(); return openEdit(e.target.dataset.expedit); }
  if ((e.key === 'Enter' || e.key === ' ') && e.target.closest && e.target.closest('.gradecard')) { e.preventDefault(); detail = 'report'; return render(); }
  const hit = e.target.closest && e.target.closest('[data-sel], [data-open]');
  if (hit && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); return hit.dataset.open ? playRingTap(hit) : selectPot(hit.dataset.sel); }
  if (view !== 'lock') return;
  if (/^[0-9]$/.test(e.key)) press(e.key);
  else if (e.key === 'Backspace') press('back');
});

// Also kept for one screen: balances that many parts of a screen ask for.
savingsBalances = memoize(savingsBalances, () => (isS(state) ? 'SV' : null));
loanSummary = memoize(loanSummary, () => (isS(state) ? 'LS' : null));
ladder = memoize(ladder, () => (isS(state) ? 'LD' : null));
try { if (!state.settings.billsFrom) { state.settings.billsFrom = nowCycle(); saveLocal(); } } catch (e) {}
// The investing grade rule starts with the next cycle for someone already using the app (so the cycle they are in
// is not judged by a rule they did not know about), or with this cycle on a fresh start.
// Net savings in the grade start with the next cycle for someone already using the app, or this cycle on a fresh
// start. Earlier cycles keep the measure they were graded with.
try { if (!state.settings.savedFrom) { state.settings.savedFrom = Object.values(state.months).some((m) => (m.income || []).length) ? addMonths(nowCycle(), 1) : nowCycle(); saveLocal(); } } catch (e) {}
try { if (!state.settings.itxFrom) { state.settings.itxFrom = Object.values(state.months).some((m) => (m.income || []).length) ? addMonths(nowCycle(), 1) : nowCycle(); saveLocal(); } } catch (e) {}
render();
startSync();
</script>
